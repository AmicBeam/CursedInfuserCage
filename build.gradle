plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'cursedinfuserbycage'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'parchment', version: '2023.06.26-1.20.1'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            
            mods {
                cursedinfuserbycage {
                    source sourceSets.main
                }
            }
        }
        
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            
            mods {
                cursedinfuserbycage {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.1.3"
    
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    
    // Goety 模组作为编译依赖（使用 CurseMaven）
    // Goety 项目ID: 586095
    // 注意：文件ID需要根据实际使用的 Goety 2.5 版本进行修改
    // 可以通过 CurseForge 网站查找对应版本的文件ID
    // 或者使用版本范围：implementation fg.deobf("curse.maven:goety-586095:[2.5,2.6)")
    implementation fg.deobf("curse.maven:goety-586095:7112220")
    
    // Ponder 作为编译时依赖（不需要安装 Ponder 作为运行时依赖）
    compileOnly fg.deobf("net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91")
    
    // No runtime dependencies needed - Goety will be provided at runtime
}

mixin {
    add sourceSets.main, 'cursedinfuserbycage.refmap.json'
    config 'mixins.cursedinfuserbycage.json'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "cursedinfuserbycage",
                "Specification-Vendor"    : "CursedInfuserByCage",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "CursedInfuserByCage",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version: project.version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

